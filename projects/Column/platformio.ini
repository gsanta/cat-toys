; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = box2_new_bootloader

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_ldf_mode = deep+
lib_deps = 
    nrf24/RF24@^1.4.9

[env:box2_old_bootloader]
build_src_filter = +<../src/toy>
upload_protocol = arduino
upload_speed = 57600
board_build.mcu = atmega328p
upload_flags =
    -D
    -V

[env:box2_new_bootloader]
board = nanoatmega328new
build_src_filter = +<../src/toy>
upload_protocol = arduino
upload_speed = 115200
board_build.mcu = atmega328p
extra_scripts =
    pre:scripts/pre_upload_reset.py
upload_flags =
    -D
    -V


[env:controller]
board = nanoatmega328new
build_src_filter = +<../src/controller>
upload_protocol = arduino
upload_speed = 115200
board_build.mcu = atmega328p
extra_scripts =
    pre:scripts/pre_upload_reset.py
upload_flags =
    -D
    -V
